name: Mobile build (Capacitor)

# Builds the iOS + Android apps from the static export. Manual-dispatch (native
# builds are slow and the macOS runner is costly) — not on every PR.
#
# Unsigned debug builds that verify the native projects compile. Release signing
# + TestFlight / Play upload are added in the Test phase (Test-7 / Test-8) with
# signing secrets.
#
# The web assets (`out/` → native `public/`) are gitignored, so each job runs
# `cap:sync` (static export + copy) before building.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run cap:sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    name: iOS (build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run cap:sync
      - name: Build (unsigned, no provisioning)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
