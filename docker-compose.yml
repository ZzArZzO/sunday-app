services:
  postgres:
    image: postgres:16-alpine
    container_name: sunday-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sunday_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sunday}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sunday} -d ${POSTGRES_DB:-sunday}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
